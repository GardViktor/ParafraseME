<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabela de Exercicios</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

 :root {
     --gb-panel: #ffffff;
     --gb-border-dark: #3b3b6d;
     --gb-border-light: #8c8cde;
     --gb-blue: #3050b0;
     --gb-blue-dark: #1c2f70;
     --gb-text: #2b2b2b;
     --gb-red: #d03838;
     --gb-yellow: #f8d030;
 }

 * {
     box-sizing: border-box;
 }

 body {
     background: var(--gb-blue-dark);
     background-image:
         repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 2px, transparent 2px, transparent 4px);
     font-family: 'Press Start 2P', 'Courier New', monospace;
     color: var(--gb-text);
     margin: 0;
     padding: 40px 24px;
     display: flex;
     flex-direction: column;
     align-items: center;
 }

 h1 {
     color: var(--gb-panel);
     font-size: 16px;
     letter-spacing: 2px;
     text-shadow: 3px 3px 0 var(--gb-border-dark);
     margin-bottom: 24px;
     text-align: center;
 }

 /* Painel principal: como a "tela de status" de um Pokémon,
    com a capa do livro de um lado e as infos do outro. */
 div {
     display: flex;
     flex-wrap: wrap;
     gap: 24px;
     width: 100%;
     max-width: 900px;
     background: var(--gb-panel);
     border: 4px solid var(--gb-border-dark);
     outline: 3px solid var(--gb-border-light);
     outline-offset: -8px;
     border-radius: 2px;
     box-shadow: 6px 6px 0 rgba(0,0,0,0.45);
     padding: 20px;
     margin-bottom: 20px;
 }

 div img {
     width: 160px;
     height: 220px;
     object-fit: cover;
     image-rendering: pixelated;
     border: 3px solid var(--gb-border-dark);
     box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
     flex-shrink: 0;
 }

 /* Bloco de texto ao lado da capa */
 div h2 {
     font-size: 14px;
     color: var(--gb-blue-dark);
     text-shadow: 1px 1px 0 var(--gb-border-light);
     margin: 0 0 12px 0;
     line-height: 1.5;
     flex-basis: 100%;
 }

 div p {
     font-size: 10px;
     line-height: 1.8;
     margin: 6px 0;
 }

 div p strong {
     color: var(--gb-blue);
     margin-right: 4px;
 }

 h3 {
     color: var(--gb-panel);
     font-size: 12px;
     letter-spacing: 1px;
     text-shadow: 2px 2px 0 var(--gb-border-dark);
     width: 100%;
     max-width: 900px;
     margin: 8px 0 12px 0;
 }

 /* Grid contínuo para a tabela de anotações — mesma técnica da listagem,
    mas com 4 colunas em vez de 8. */
 table {
     display: grid;
     grid-template-columns: 1fr 0.7fr 3fr 1fr;
     width: 100%;
     max-width: 900px;
     background: var(--gb-panel);
     border: 4px solid var(--gb-border-dark);
     outline: 3px solid var(--gb-border-light);
     outline-offset: -8px;
     border-radius: 2px;
     box-shadow: 6px 6px 0 rgba(0,0,0,0.45);
     border-collapse: collapse;
     padding: 6px;
     margin-bottom: 24px;
 }

 thead,
 tbody,
 tr {
     display: contents;
 }

 th {
     font-size: 9px;
     color: var(--gb-panel);
     background: var(--gb-blue);
     padding: 10px 8px;
     text-align: left;
     text-shadow: 1px 1px 0 var(--gb-border-dark);
 }

 td {
     font-size: 9px;
     line-height: 1.6;
     padding: 12px 8px;
     display: flex;
     align-items: center;
     word-break: break-word;
     border-bottom: 2px dashed var(--gb-border-light);
 }

 tbody tr:last-child td {
     border-bottom: none;
 }

 tbody tr:hover td {
     background: var(--gb-yellow);
 }

 /* Link "Voltar" como botão de comando do menu */
 a {
     display: inline-block;
     font-family: 'Press Start 2P', monospace;
     font-size: 9px;
     text-decoration: none;
     color: var(--gb-panel);
     background: var(--gb-blue);
     border: 2px solid var(--gb-border-dark);
     padding: 10px 16px;
     border-radius: 2px;
     box-shadow: 2px 2px 0 var(--gb-border-dark);
     transition: transform 0.05s;
 }

 a:hover {
     background: var(--gb-red);
     transform: translate(1px, 1px);
     box-shadow: 1px 1px 0 var(--gb-border-dark);
 }

 a:active {
     transform: translate(2px, 2px);
     box-shadow: none;
 }

 /* Responsivo: capa em cima, texto embaixo; tabela vira "fichas" empilhadas */
 @media (max-width: 700px) {
     div {
         flex-direction: column;
         align-items: center;
         text-align: center;
     }

     div img {
         width: 140px;
         height: 190px;
     }

     table {
         display: block;
         border: none;
         outline: none;
         box-shadow: none;
         background: transparent;
         padding: 0;
     }

     thead {
         display: none;
     }

     tbody {
         display: block;
     }

     tbody tr {
         display: flex;
         flex-direction: column;
         align-items: flex-start;
         gap: 4px;
         background: var(--gb-panel);
         border: 3px solid var(--gb-border-dark);
         outline: 2px solid var(--gb-border-light);
         outline-offset: -6px;
         border-radius: 2px;
         margin-bottom: 14px;
         padding: 12px;
         box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
     }

     td {
         width: 100%;
         padding: 4px 0;
         border-bottom: none;
     }
 }
    </style>
</head>
<body>
<h1>Detalhes do Exercicio</h1>
<div>
    <h2 th:text="${exercicio.enunciado}"></h2>
    <p><strong>Status:</strong> <span th:text="${exercicio.resolvido}"></span></p>
    <p><strong>Solução:</strong> <span th:text="${exercicio.linkSolucao}"></span></p>

    <h3>Anotações:</h3>
    <table>
        <thead>
        <tr>
            <th>Capítulo</th>
            <th>Página</th>
            <th>Anotação</th>
            <th>Data</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="anotacao : ${exercicio.anotacoes}">
            <td th:text="${anotacao.capitulo}"></td>
            <td th:text="${anotacao.pagina}"></td>
            <td th:text="${anotacao.minhaAnotacao}"></td>
            <td th:text="${anotacao.dataCadastro}"></td>
        </tr>
        </tbody>
    </table>
</div>
<a href="/exercicios/ui/listar">Voltar para a lista de exercicios</a>
</body>
</html>
