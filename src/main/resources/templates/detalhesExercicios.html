<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes do Exercício</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --gb-panel: #ffffff;
            --gb-border-dark: #3b3b6d;
            --gb-border-light: #8c8cde;
            --gb-blue: #3050b0;
            --gb-blue-dark: #1c2f70;
            --gb-text: #2b2b2b;
            --gb-red: #d03838;
            --gb-yellow: #f8d030;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--gb-blue-dark);
            background-image:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 2px, transparent 2px, transparent 4px);
            font-family: 'Press Start 2P', 'Courier New', monospace;
            color: var(--gb-text);
            margin: 0;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--gb-panel);
            font-size: 16px;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 var(--gb-border-dark);
            margin-bottom: 24px;
            text-align: center;
        }

        /* Painel principal com o enunciado e status do exercício */
        .detalhes-painel {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            max-width: 900px;
            background: var(--gb-panel);
            border: 4px solid var(--gb-border-dark);
            outline: 3px solid var(--gb-border-light);
            outline-offset: -8px;
            border-radius: 2px;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.45);
            padding: 20px;
            margin-bottom: 20px;
        }

        .detalhes-painel h2 {
            font-size: 14px;
            color: var(--gb-blue-dark);
            text-shadow: 1px 1px 0 var(--gb-border-light);
            margin: 0 0 12px 0;
            line-height: 1.5;
            flex-basis: 100%;
        }

        .detalhes-painel p {
            font-size: 10px;
            line-height: 1.8;
            margin: 6px 0;
            flex-basis: 100%;
        }

        .detalhes-painel p strong {
            color: var(--gb-blue);
            margin-right: 4px;
        }

        h3 {
            color: var(--gb-panel);
            font-size: 12px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 var(--gb-border-dark);
            width: 100%;
            max-width: 900px;
            margin: 8px 0 12px 0;
        }

        /* Grid contínuo para a tabela de anotações — mesma técnica da listagem,
           com 4 colunas (Capítulo, Página, Anotação, Data). */
        table {
            display: grid;
            grid-template-columns: 1fr 0.7fr 3fr 1fr;
            width: 100%;
            max-width: 900px;
            background: var(--gb-panel);
            border: 4px solid var(--gb-border-dark);
            outline: 3px solid var(--gb-border-light);
            outline-offset: -8px;
            border-radius: 2px;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.45);
            border-collapse: collapse;
            padding: 6px;
            margin-bottom: 24px;
        }

        thead,
        tbody,
        tr {
            display: contents;
        }

        th {
            font-size: 9px;
            color: var(--gb-panel);
            background: var(--gb-blue);
            padding: 10px 8px;
            text-align: left;
            text-shadow: 1px 1px 0 var(--gb-border-dark);
            position: sticky;
            top: 0;
        }

        td {
            font-size: 9px;
            line-height: 1.6;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            word-break: break-word;
            border-bottom: 2px dashed var(--gb-border-light);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover td {
            background: var(--gb-yellow);
        }

        /* Estado vazio, quando o exercício ainda não tem anotações */
        .vazio {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px 8px;
            font-size: 9px;
            color: var(--gb-text);
        }

        /* Link "Voltar" como botão de comando do menu */
        a {
            display: inline-block;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            text-decoration: none;
            color: var(--gb-panel);
            background: var(--gb-blue);
            border: 2px solid var(--gb-border-dark);
            padding: 10px 16px;
            border-radius: 2px;
            box-shadow: 2px 2px 0 var(--gb-border-dark);
            transition: transform 0.05s;
        }

        a:hover {
            background: var(--gb-red);
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--gb-border-dark);
        }

        a:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* Responsivo: tabela de anotações vira "fichas" empilhadas com rótulo */
        @media (max-width: 700px) {
            .detalhes-painel {
                padding: 16px;
            }

            table {
                display: block;
                border: none;
                outline: none;
                box-shadow: none;
                background: transparent;
                padding: 0;
            }

            thead {
                display: none;
            }

            tbody {
                display: block;
            }

            tbody tr {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                background: var(--gb-panel);
                border: 3px solid var(--gb-border-dark);
                outline: 2px solid var(--gb-border-light);
                outline-offset: -6px;
                border-radius: 2px;
                margin-bottom: 14px;
                padding: 12px;
                box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
            }

            td {
                width: 100%;
                padding: 0;
                border-bottom: none;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            td::before {
                content: attr(data-label);
                font-size: 8px;
                color: var(--gb-blue);
                text-shadow: none;
            }
        }
    </style>
</head>
<body>
<h1>Detalhes do Exercício</h1>
<div class="detalhes-painel">
    <h2 th:text="${exercicio.enunciado}"></h2>
    <p><strong>Id:</strong> <span th:text="${exercicio.id}"></span></p>
    <p><strong>Status:</strong> <span th:text="${exercicio.resolvido}"></span></p>
    <p><strong>Solução:</strong> <span th:text="${exercicio.linkSolucao}"></span></p>
</div>

<h3>Anotações:</h3>
<table>
    <thead>
    <tr>
        <th>Capítulo</th>
        <th>Página</th>
        <th>Anotação</th>
        <th>Data</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="anotacao : ${exercicio.anotacoes}">
        <td data-label="Capítulo" th:text="${anotacao.capitulo}"></td>
        <td data-label="Página" th:text="${anotacao.pagina}"></td>
        <td data-label="Anotação" th:text="${anotacao.minhaAnotacao}"></td>
        <td data-label="Data" th:text="${anotacao.dataCadastro}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(exercicio.anotacoes)}">
        <td class="vazio">Nenhuma anotação vinculada a este exercício ainda.</td>
    </tr>
    </tbody>
</table>

<a th:href="@{/exercicios/ui/listar}">Voltar para a lista de exercícios</a>
</body>
</html>
