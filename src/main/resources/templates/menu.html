<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu Principal</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
        --gb-panel: #ffffff;
        --gb-border-dark: #3b3b6d;
        --gb-border-light: #8c8cde;
        --gb-blue: #3050b0;
        --gb-blue-dark: #1c2f70;
        --gb-text: #2b2b2b;
        --gb-red: #d03838;
        --gb-yellow: #f8d030;
    }

    * {
        box-sizing: border-box;
    }

    body {
        background: var(--gb-blue-dark);
        background-image:
            repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 2px, transparent 2px, transparent 4px);
        font-family: 'Press Start 2P', 'Courier New', monospace;
        color: var(--gb-text);
        margin: 0;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        justify-content: center;
    }

    h1 {
        color: var(--gb-panel);
        font-size: 18px;
        letter-spacing: 2px;
        text-shadow: 3px 3px 0 var(--gb-border-dark);
        margin-bottom: 32px;
        text-align: center;
    }

    .menu-container {
        width: 100%;
        max-width: 380px;
        background: var(--gb-panel);
        border: 4px solid var(--gb-border-dark);
        outline: 3px solid var(--gb-border-light);
        outline-offset: -8px;
        border-radius: 2px;
        box-shadow: 6px 6px 0 rgba(0,0,0,0.45);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    a {
        display: block;
        width: 100%;
        box-sizing: border-box;
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        text-decoration: none;
        text-align: center;
        color: var(--gb-panel);
        background: var(--gb-blue);
        border: 2px solid var(--gb-border-dark);
        padding: 16px;
        border-radius: 2px;
        box-shadow: 3px 3px 0 var(--gb-border-dark);
        transition: transform 0.05s;
    }

    a:hover {
        background: var(--gb-red);
        transform: translate(1px, 1px);
        box-shadow: 2px 2px 0 var(--gb-border-dark);
    }

    a:active {
        transform: translate(3px, 3px);
        box-shadow: none;
    }

    @media (max-width: 480px) {
        .menu-container {
            padding: 18px;
        }

        h1 {
            font-size: 14px;
        }
    }
  </style>
</head>
<body>
<h1>ParafraseME</h1>
<div class="menu-container">
  <a th:href="@{/livros/ui/listar}">Livros</a>
  <a th:href="@{/anotacoes/ui/listar}">Anotações</a>
  <a th:href="@{/exercicios/ui/listar}">Exercícios</a>
</div>
</body>
</html>
