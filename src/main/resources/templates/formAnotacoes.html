<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adicionar Nova Anotação</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --gb-panel: #ffffff;
            --gb-border-dark: #3b3b6d;
            --gb-border-light: #8c8cde;
            --gb-blue: #3050b0;
            --gb-blue-dark: #1c2f70;
            --gb-text: #2b2b2b;
            --gb-red: #d03838;
            --gb-yellow: #f8d030;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--gb-blue-dark);
            background-image:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 2px, transparent 2px, transparent 4px);
            font-family: 'Press Start 2P', 'Courier New', monospace;
            color: var(--gb-text);
            margin: 0;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--gb-panel);
            font-size: 16px;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 var(--gb-border-dark);
            margin-bottom: 24px;
            text-align: center;
        }

        /* Painel do formulário, mesma "moldura" usada no card de detalhes */
        .form-container {
            width: 100%;
            max-width: 420px;
            background: var(--gb-panel);
            border: 4px solid var(--gb-border-dark);
            outline: 3px solid var(--gb-border-light);
            outline-offset: -8px;
            border-radius: 2px;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.45);
            padding: 24px;
        }

        .mensagem {
            font-size: 9px;
            color: var(--gb-blue-dark);
            background: var(--gb-yellow);
            border: 2px solid var(--gb-border-dark);
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 2px;
        }

        label {
            font-size: 9px;
            color: var(--gb-blue-dark);
            text-shadow: 1px 1px 0 var(--gb-border-light);
            margin: 14px 0 6px;
            display: block;
        }

        input,
        textarea {
            width: 100%;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            /* 16px evita o zoom automático do Safari/iOS ao focar o campo */
            font-size: 16px;
            padding: 10px 8px;
            border: 2px solid var(--gb-border-dark);
            border-radius: 2px;
            background: #f4f4ff;
            color: var(--gb-text);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
            line-height: 1.5;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--gb-blue);
            background: #ffffff;
        }

        button {
            display: block;
            width: 100%;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--gb-panel);
            background: var(--gb-blue);
            border: 2px solid var(--gb-border-dark);
            padding: 12px;
            border-radius: 2px;
            box-shadow: 3px 3px 0 var(--gb-border-dark);
            cursor: pointer;
            margin-top: 24px;
            transition: transform 0.05s;
        }

        button:hover {
            background: var(--gb-red);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--gb-border-dark);
        }

        a {
            display: block;
            width: 100%;
            box-sizing: border-box;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            text-decoration: none;
            text-align: center;
            color: var(--gb-panel);
            background: var(--gb-blue);
            border: 2px solid var(--gb-border-dark);
            padding: 12px 16px;
            border-radius: 2px;
            box-shadow: 3px 3px 0 var(--gb-border-dark);
            margin-top: 20px;
            transition: transform 0.05s;
        }

        a:hover {
            background: var(--gb-red);
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--gb-border-dark);
        }

        a:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 24px 12px;
            }

            h1 {
                font-size: 13px;
            }

            .form-container {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
<h1>Adicionar Nova Anotação</h1>
<div class="form-container">
    <div th:if="${mensagem}" class="mensagem" th:text="${mensagem}"></div>
    <form th:action="@{/anotacoes/ui/salvar}" th:object="${anotacao}" method="post">
        <label for="capitulo">Capítulo:</label>
        <input type="text" id="capitulo" th:field="*{capitulo}" required />
        <label for="pagina">Página:</label>
        <input type="number" id="pagina" th:field="*{pagina}" />
        <label for="minhaAnotacao">Anotação:</label>
        <textarea id="minhaAnotacao" th:field="*{minhaAnotacao}" required></textarea>
        <button type="submit">Cadastrar Anotação</button>
    </form>
    <a th:href="@{/anotacoes/ui/listar}">Voltar para a lista de anotações</a>
</div>
</body>
</html>
