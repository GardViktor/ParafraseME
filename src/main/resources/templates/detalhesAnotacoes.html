<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes da Anotação</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --gb-panel: #ffffff;
            --gb-border-dark: #3b3b6d;
            --gb-border-light: #8c8cde;
            --gb-blue: #3050b0;
            --gb-blue-dark: #1c2f70;
            --gb-text: #2b2b2b;
            --gb-red: #d03838;
            --gb-yellow: #f8d030;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--gb-blue-dark);
            background-image:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 2px, transparent 2px, transparent 4px);
            font-family: 'Press Start 2P', 'Courier New', monospace;
            color: var(--gb-text);
            margin: 0;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--gb-panel);
            font-size: 16px;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 var(--gb-border-dark);
            margin-bottom: 24px;
            text-align: center;
        }

        .detalhes-painel {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            max-width: 900px;
            background: var(--gb-panel);
            border: 4px solid var(--gb-border-dark);
            outline: 3px solid var(--gb-border-light);
            outline-offset: -8px;
            border-radius: 2px;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.45);
            padding: 20px;
            margin-bottom: 20px;
        }

        .detalhes-painel h2 {
            font-size: 14px;
            color: var(--gb-blue-dark);
            text-shadow: 1px 1px 0 var(--gb-border-light);
            margin: 0 0 12px 0;
            line-height: 1.5;
            flex-basis: 100%;
        }

        .detalhes-painel p {
            font-size: 10px;
            line-height: 1.8;
            margin: 6px 0;
            flex-basis: 100%;
        }

        .detalhes-painel p strong {
            color: var(--gb-blue);
            margin-right: 4px;
        }

        .anotacao-texto {
            background: #f4f4ff;
            border: 2px solid var(--gb-border-dark);
            border-radius: 2px;
            padding: 12px;
            font-size: 10px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .btn-adicionar {
            display: inline-block;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            text-decoration: none;
            color: var(--gb-panel);
            background: var(--gb-blue);
            border: 2px solid var(--gb-border-dark);
            padding: 12px 16px;
            border-radius: 2px;
            box-shadow: 3px 3px 0 var(--gb-border-dark);
            margin-bottom: 24px;
            transition: transform 0.05s;
        }

        .btn-adicionar:hover {
            background: var(--gb-red);
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 var(--gb-border-dark);
        }

        .btn-adicionar:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        h3 {
            color: var(--gb-panel);
            font-size: 12px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 var(--gb-border-dark);
            width: 100%;
            max-width: 900px;
            margin: 8px 0 12px 0;
        }

        table {
            display: grid;
            grid-template-columns: 1.5fr 1fr 2fr 1.5fr;
            width: 100%;
            max-width: 900px;
            background: var(--gb-panel);
            border: 4px solid var(--gb-border-dark);
            outline: 3px solid var(--gb-border-light);
            outline-offset: -8px;
            border-radius: 2px;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.45);
            border-collapse: collapse;
            padding: 6px;
            margin-bottom: 24px;
        }

        thead,
        tbody,
        tr {
            display: contents;
        }

        th {
            font-size: 9px;
            color: var(--gb-panel);
            background: var(--gb-blue);
            padding: 10px 8px;
            text-align: left;
            text-shadow: 1px 1px 0 var(--gb-border-dark);
            position: sticky;
            top: 0;
        }

        td {
            font-size: 9px;
            line-height: 1.6;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            word-break: break-word;
            border-bottom: 2px dashed var(--gb-border-light);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover td {
            background: var(--gb-yellow);
        }

        td a {
            display: inline-block;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            text-decoration: none;
            white-space: nowrap;
            color: var(--gb-panel);
            background: var(--gb-blue);
            border: 2px solid var(--gb-border-dark);
            padding: 6px 8px;
            border-radius: 2px;
            box-shadow: 2px 2px 0 var(--gb-border-dark);
            transition: transform 0.05s;
        }

        td a:hover {
            background: var(--gb-red);
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--gb-border-dark);
        }

        td a:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        td:last-child {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            justify-content: center;
        }

        .vazio {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px 8px;
            font-size: 9px;
            color: var(--gb-text);
        }

        .voltar {
            display: inline-block;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            text-decoration: none;
            color: var(--gb-panel);
            background: var(--gb-blue);
            border: 2px solid var(--gb-border-dark);
            padding: 10px 16px;
            border-radius: 2px;
            box-shadow: 2px 2px 0 var(--gb-border-dark);
            transition: transform 0.05s;
        }

        .voltar:hover {
            background: var(--gb-red);
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--gb-border-dark);
        }

        .voltar:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        @media (max-width: 700px) {
            .detalhes-painel {
                padding: 16px;
            }

            table {
                display: block;
                border: none;
                outline: none;
                box-shadow: none;
                background: transparent;
                padding: 0;
            }

            thead {
                display: none;
            }

            tbody {
                display: block;
            }

            tbody tr {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                background: var(--gb-panel);
                border: 3px solid var(--gb-border-dark);
                outline: 2px solid var(--gb-border-light);
                outline-offset: -6px;
                border-radius: 2px;
                margin-bottom: 14px;
                padding: 12px;
                box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
            }

            td {
                width: 100%;
                padding: 0;
                border-bottom: none;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            td::before {
                content: attr(data-label);
                font-size: 8px;
                color: var(--gb-blue);
                text-shadow: none;
            }

            td:last-child {
                justify-content: flex-start;
                padding-top: 4px;
                border-top: 2px dashed var(--gb-border-light);
            }

            td:last-child::before {
                content: none;
            }
        }
    </style>
</head>
<body>

<h1>Detalhes da Anotação</h1>

<div class="detalhes-painel">
    <h2 th:text="${'Capítulo: ' + anotacao.capitulo}"></h2>

    <p>
        <strong>Id:</strong>
        <span th:text="${anotacao.id}"></span>
    </p>

    <p>
        <strong>Página:</strong>
        <span th:text="${anotacao.pagina}"></span>
    </p>

    <p>
        <strong>Data:</strong>
        <span th:text="${anotacao.dataCadastro}"></span>
    </p>

    <p>
        <strong>Anotação:</strong>
    </p>

    <p class="anotacao-texto"
       th:text="${anotacao.minhaAnotacao}">
    </p>
</div>

<a class="btn-adicionar" th:href="@{/exercicios/ui/adicionar/{anotacaoId}(anotacaoId=${anotacao.id})}">Adicionar Exercício</a>

<h3>Exercícios:</h3>

<table>
    <thead>
    <tr>
        <th>Enunciado</th>
        <th>Resolvido</th>
        <th>Solução</th>
        <th>Ações</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="exercicio : ${anotacao.exercicios}">

        <td data-label="Enunciado"
            th:text="${exercicio.enunciado}">
        </td>

        <td data-label="Resolvido"
            th:text="${exercicio.resolvido}">
        </td>

        <td data-label="Solução"
            th:text="${exercicio.linkSolucao}">
        </td>

        <td>

            <a th:href="@{/exercicios/ui/listar/{id}(id=${exercicio.id})}">
                Detalhes
            </a>

            <a th:href="@{/exercicios/ui/alterar/{id}(id=${exercicio.id})}">
                Alterar
            </a>

            <a th:href="@{/exercicios/ui/deletar/{id}(id=${exercicio.id})}">
                Deletar
            </a>

        </td>

    </tr>

    <tr th:if="${#lists.isEmpty(anotacao.exercicios)}">

        <td class="vazio">
            Nenhum exercício vinculado a esta anotação ainda.
        </td>

    </tr>

    </tbody>
</table>

<a class="voltar"
   th:href="@{/anotacoes/ui/listar}">
    Voltar para a lista de anotações
</a>

</body>
</html>
